<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<!-- MENÚ: un botón por sección. SI AGREGO SECCIÓN: botón aquí + <section> abajo
     + línea en ocultarSecciones() del JS -->
<nav>
  <button onclick="mostrarSeccion('parametros')">Parámetros</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
  <button onclick="mostrarSeccion('creditos')">Créditos</button>
  <!-- además de mostrar la sección, pinta todos los créditos registrados -->
  <button onclick="mostrarSeccion('listaCreditos'); pintarCreditos(creditos);">Créditos Registrados</button>
</nav>

<!-- ============ SECCIÓN: PARÁMETROS (tasa) ============ -->
<section id="parametros">
  <h2>Configurar Parámetros</h2>

  <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>
  <br>
  <button onclick="guardarTasa()">Guardar tasa</button>
  <p id="mensajeTasa"></p> <!-- mensaje de guardarTasa() -->

</section>

<!-- ============ SECCIÓN: CLIENTES ============ -->
<section id="clientes">
  <h2>Registro de Clientes</h2>

  <!-- Formulario: cada id lo lee guardarCliente() -->
  <input type="text"   id="cedula"    placeholder="Cédula">
  <input type="text"   id="nombre"    placeholder="Nombre">
  <input type="text"   id="apellido"  placeholder="Apellido">
  <input type="number" id="ingresos"  placeholder="Ingresos">
  <input type="number" id="egresos"   placeholder="Egresos">
  <br>
  <button onclick="guardarCliente()">Guardar cliente</button>
  <button onclick="limpiar()">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <!-- vacío: las filas las genera pintarClientes() -->
    <tbody id="tablaClientes">
    </tbody>
  </table>
</section>

<!-- ============ SECCIÓN: CRÉDITOS ============ -->
<section id="creditos">
  <h2>Solicitar Crédito</h2>

  <!-- 1) buscar cliente -> buscarClienteCredito() -->
  <input type="text" id="buscarCedulaCredito" placeholder="Cédula del cliente">
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div> <!-- datos del cliente -->

  <!-- 2) datos del crédito (plazo en AÑOS) -->
  <input type="number" id="montoCredito" placeholder="Monto del crédito">
  <input type="number" id="plazoCredito" placeholder="Plazo en años">

  <br>

  <!-- 3) calcular -> calcularCredito() -->
  <button onclick="calcularCredito()">Calcular crédito</button>

  <div id="resultadoCredito"></div> <!-- resultado aprobado/rechazado -->

  <!-- 4) Asignar Crédito: empieza desactivado, calcularCredito() lo activa
        solo si el crédito fue aprobado. Al presionarlo, asignarCredito() lo guarda -->
  <button id="btnAsignarCredito" onclick="asignarCredito()" disabled>
    Asignar Crédito
  </button>
</section>

<!-- ============ SECCIÓN: CRÉDITOS REGISTRADOS (historial) ============ -->
<section id="listaCreditos">
  <h2>Créditos Registrados</h2>

  <!-- Buscar -> buscarCreditosCliente() (un cliente). Ver todos -> pintarCreditos(creditos) -->
  <input type="text" id="buscarCedulaListado" placeholder="Cédula del cliente">
  <button onclick="buscarCreditosCliente()">Buscar</button>
  <button onclick="pintarCreditos(creditos)">Ver todos</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Monto</th>
        <th>Tasa</th>
        <th>Plazo</th>
        <th>Cuota</th>
      </tr>
    </thead>
    <!-- vacío: las filas las genera pintarCreditos() -->
    <tbody id="tablaCreditos">
    </tbody>
  </table>
</section>

<!-- Orden importante: utilitarios y funciones primero, la lógica al final -->
<script src="utilitarios.js"></script>
<script src="funciones.js"></script>
<script src="simulador_completo.js"></script>

</body>
</html>
