<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <!-- Estilos de la página -->
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<!-- Menú: cada botón llama a mostrarSeccion con el id de la sección a mostrar -->
<nav>
  <button onclick="mostrarSeccion('parametros')">Parámetros</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
  <button onclick="mostrarSeccion('creditos')">Créditos</button>
</nav>

<!-- SECCIÓN 1: configurar la tasa de interés (entre 10 y 20, por defecto 15) -->
<section id="parametros">
  <h2>Configurar Parámetros</h2>

  <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>
  <br>
  <button onclick="guardarTasa()">Guardar tasa</button>
  <!-- Aquí guardarTasa() escribe si la tasa es válida o no -->
  <p id="mensajeTasa"></p>

</section>

<!-- SECCIÓN 2: registro de clientes -->
<section id="clientes">
  <h2>Registro de Clientes</h2>

  <!-- Cada input tiene id (para leerlo desde JS) y placeholder (texto de ayuda) -->
  <input type="text"   id="cedula"    placeholder="Cédula">
  <input type="text"   id="nombre"    placeholder="Nombre">
  <input type="text"   id="apellido"  placeholder="Apellido">
  <input type="number" id="ingresos"  placeholder="Ingresos">
  <input type="number" id="egresos"   placeholder="Egresos">
  <br>
  <button onclick="guardarCliente()">Guardar cliente</button>
  <button onclick="limpiar()">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <!-- Vacío a propósito: pintarClientes() genera las filas desde JavaScript -->
    <tbody id="tablaClientes">
    </tbody>
  </table>
</section>

<!-- SECCIÓN 3: solicitar crédito (mismo id que usa el botón del menú: "creditos") -->
<section id="creditos">
  <h2>Solicitar Crédito</h2>

  <!-- Busco al cliente por cédula; sus datos aparecen en el div de abajo -->
  <input type="text" id="buscarCedulaCredito" placeholder="Cédula del cliente">
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div>

  <!-- Monto del crédito y plazo en AÑOS -->
  <input type="number" id="montoCredito" placeholder="Monto del crédito">
  <input type="number" id="plazoCredito" placeholder="Plazo en años">

  <br>

  <button onclick="calcularCredito()">Calcular crédito</button>

  <!-- Aquí se muestra capacidad de pago, total, cuota y si fue aprobado o rechazado -->
  <div id="resultadoCredito"></div>

  <!-- Este botón sigue desactivado: se usará en la siguiente parte del taller -->
  <button id="btnSolicitarCredito" onclick="solicitarCredito()" disabled>
    Solicitar crédito
  </button>
</section>


<!-- Orden de scripts: primero las herramientas y los cálculos, al final la lógica que los usa -->
<script src="utilitarios.js"></script>
<script src="funciones.js"></script>
<script src="simulador_completo.js"></script>

</body>
</html>
